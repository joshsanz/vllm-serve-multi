# Installed to /etc/telegraf/telegraf.d/gpu_serve.conf by install.sh.
# Long-running collector; telegraf writes a newline on stdin each interval
# and the script answers with influx line protocol (gpu_serve, gpu_serve_model).
[[inputs.execd]]
  command = ["/opt/serve-telemetry/venv/bin/python", "/opt/serve-telemetry/gpu_serve_telemetry.py"]
  signal = "STDIN"
  restart_delay = "10s"
  data_format = "influx"

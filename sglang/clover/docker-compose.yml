# Clover-35B-A3B-Preview (block-diffusion LLM) as the chat model on :8000, plus the d3-flash
# decision model (vLLM Semantic Router "vllm-srun" runtime) on :8001. Replaces the vllm/systemone
# LFM2.5-24B-A2B pairing; the systemone service reuses that directory's Dockerfile and models.yaml.
#
#   docker compose up -d --build        # first start downloads ~69 GB of BF16 weights
#   curl localhost:8001/v1/models
#   curl localhost:8000/v1/chat/completions -H 'content-type: application/json' \
#     -d '{"model":"clover-35b-a3b","messages":[{"role":"user","content":"hi"}]}'
#
# Clover only serves through the SGLang PR (see ./Dockerfile), with --speculative-algorithm CLOVER
# (self-speculative: it drafts a block and verifies it with the same weights, no draft model).
# Memory (~121 GiB pool): d3-flash ~19 GiB + Clover util 0.88 (weights are ~66 GB; lower values fail the hybrid state-cache budget: each request needs 4 big state slots, so ~2 concurrent requests fit).
# Stop every other stack first; start systemone before clover so its placement check sees free
# memory, and drop the page cache if it reports too little free (see vllm/systemone/docker-compose.yml):
#   sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - {driver: nvidia, count: all, capabilities: [gpu]}

services:
  systemone:
    <<: *gpu
    build: ../../vllm/systemone
    image: systemone:local
    container_name: systemone
    restart: unless-stopped
    logging: *logging
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ../../vllm/systemone/models.yaml:/etc/vllm-srun/models.yaml:ro
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - serve
      - --models=/etc/vllm-srun/models.yaml
      - --host=0.0.0.0
      - --port=8000

  clover:
    <<: *gpu
    build: .
    image: sglang-clover:local
    container_name: clover
    restart: unless-stopped
    logging: *logging
    depends_on:
      - systemone
    ipc: host
    shm_size: "16gb"
    ports:
      - "8000:30000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - Diffuspace/Clover-35B-A3B-Preview
      - --served-model-name
      - clover-35b-a3b
      - --host
      - "0.0.0.0"
      - --port
      - "30000"
      - --trust-remote-code
      - --speculative-algorithm
      - CLOVER
      - --tp
      - "1"
      - --context-length
      - "131072"
      - --mem-fraction-static
      - "0.88"
      - --max-running-requests
      - "4"
      # Model card's max_new_tokens (24576) as the default when a request sets no max_tokens. Merged
      # over Clover's built-in presence 0.9 / repetition 1.05 defaults, so those stay in effect.
      - --preferred-sampling-params
      - '{"max_new_tokens": 24576}'
      # Preview/verify width (must divide the checkpoint's block size of 32). 16 is what the PR
      # validated, and the default 32 doesn't fit the hybrid state cache next to d3-flash.
      - --speculative-num-draft-tokens
      - "16"
      # Qwen3.6 base: <think> reasoning and qwen3_coder XML tool calls.
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder

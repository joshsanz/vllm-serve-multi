# Standalone compose stack for nvidia/Qwen3.8-Flash-Next-FP4-Local — NOT part of the
# other stacks. Own directory so compose derives its own project name.
#
# NVIDIA's QAD NVFP4/MXFP8 checkpoint of Qwen3.8-Flash-Next (125B total / 6B active + 51B
# n-gram embedding + 4B MTP, ~96 GiB on disk). Its NVFP4 scale factors use a new format that
# upstream vLLM does not support yet, so this uses the community image from the model card's
# DGX Spark recipe (eugr/spark-vllm-b12x, arm64) instead of vllm/vllm-openai. Env vars and
# flags below are copied from that recipe; the n-gram embedding table (PLE) stays on disk
# (VLLM_PLE_TABLE_MEMORY=disk), which is what lets it fit alongside the KV cache.
#
# The checkpoint nearly fills the ~121 GiB pool: stop every other stack first (including
# systemone), and drop the page cache before starting (see systemone/docker-compose.yml):
#   sudo sh -c 'echo 1 > /proc/sys/vm/drop_caches'
# First start downloads ~96 GB. Replaces the GGUF recipe in ../../unsloth/qwen38-flash-next.sh.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-gpu: &default-gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  qwen38-flash-next:
    image: eugr/spark-vllm-b12x:latest
    container_name: qwen38-flash-next
    restart: unless-stopped
    logging: *default-logging
    <<: *default-gpu
    ipc: host
    entrypoint: ["vllm"]
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: "16gb"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/vllm:/root/.cache/vllm
      - ~/.cache/flashinfer:/root/.cache/flashinfer
      - ~/.triton:/root/.triton
      - ~/.cache/b12x:/root/.cache/b12x
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_NO_USAGE_STATS: "1"
      PYTHONUNBUFFERED: "1"
      VLLM_PLE_TABLE_MEMORY: "disk"
      B12X_DISK_BACKEND: "io_uring"
      CUTE_DSL_ARCH: "sm_121a"
      SAFETENSORS_FAST_GPU: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_SSM_CONV_STATE_LAYOUT: "DS"
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      B12X_POLICY_MODE: "auto"
      VLLM_MXFP8_LM_HEAD: "1"
      VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: "w13"
      VLLM_B12X_MOE_FP4_FORCE_A16: "1"
      B12X_W4A16_A4_PREFILL: "1"
    command:
      - serve
      - nvidia/Qwen3.8-Flash-Next-FP4-Local
      - --served-model-name
      - qwen3.8-flash-next
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --pipeline-parallel-size
      - "1"
      - --mamba-cache-mode
      - align
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --dtype
      - bfloat16
      - --kv-cache-dtype
      - fp8
      - --quantization
      - modelopt_mixed
      - --block-size
      - "16"
      - --load-format
      - b12x
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "4096"
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":4}'
      - --gdn-decode-kernel
      - b12x
      - --linear-backend
      - b12x
      - --moe-backend
      - b12x
      - --no-enable-flashinfer-autotune
      - --mm-encoder-tp-mode
      - data
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
      - --compilation-config
      - '{"pass_config":{"fuse_act_quant":true}}'
      - --gpu-memory-utilization
      - "0.8"
